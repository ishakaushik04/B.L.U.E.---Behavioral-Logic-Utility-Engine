<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BLUE</title>
<style>
  :root {
    --bg-deep: #05070a;
    --bg-panel: #0b1017;
    --cyan: #4ce0ff;
    --cyan-dim: #1c5f73;
    --cyan-glow: rgba(76, 224, 255, 0.55);
    --amber: #ffb347;
    --red: #ff4d5e;
    --text-main: #d9f4ff;
    --text-dim: #6f95a6;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(circle at 50% 20%, #0d1620 0%, var(--bg-deep) 70%);
    color: var(--text-main);
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
  }

  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 32px 16px 40px;
    position: relative;
  }

  /* --- Header --- */
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    z-index: 2;
  }
  .brand h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 6px;
    font-weight: 600;
    color: var(--cyan);
    text-shadow: 0 0 12px var(--cyan-glow);
  }
  .brand span {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* --- Background grid --- */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(76,224,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(76,224,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    mask-image: radial-gradient(circle at 50% 45%, black 10%, transparent 70%);
  }

  /* --- Core voice ring --- */
  .core-wrap {
    position: relative;
    width: min(70vw, 320px);
    height: min(70vw, 320px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid var(--cyan-dim);
    opacity: 0.6;
  }
  .ring-outer { inset: 0; }
  .ring-mid { inset: 10%; border-color: rgba(76,224,255,0.25); }

  .ring-outer, .ring-mid {
    animation: rotate 18s linear infinite;
  }
  .ring-mid { animation-direction: reverse; animation-duration: 12s; }

  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .pulse-ring {
    position: absolute;
    inset: 18%;
    border-radius: 50%;
    border: 2px solid var(--cyan);
    box-shadow: 0 0 30px var(--cyan-glow), inset 0 0 30px var(--cyan-glow);
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
  }

  .mic-btn {
    position: relative;
    width: 40%;
    height: 40%;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 30%, #1a2b36, #060a0e 70%);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 25px rgba(76,224,255,0.35), inset 0 0 15px rgba(0,0,0,0.6);
    transition: transform 0.15s ease, box-shadow 0.3s ease;
    z-index: 3;
  }
  .mic-btn:active { transform: scale(0.96); }

  .mic-btn svg {
    width: 42%;
    height: 42%;
    fill: var(--cyan);
    filter: drop-shadow(0 0 6px var(--cyan-glow));
    transition: fill 0.3s ease, filter 0.3s ease;
  }

  /* State-driven styling */
  .app[data-state="idle"] .pulse-ring { border-color: var(--cyan-dim); box-shadow: 0 0 14px rgba(76,224,255,0.15); }

  .app[data-state="listening"] .pulse-ring {
    border-color: var(--cyan);
    animation: breathe 1.4s ease-in-out infinite;
  }
  .app[data-state="listening"] .mic-btn { box-shadow: 0 0 45px var(--cyan-glow), inset 0 0 15px rgba(0,0,0,0.6); }

  .app[data-state="thinking"] .pulse-ring {
    border-color: var(--amber);
    box-shadow: 0 0 30px rgba(255,179,71,0.55), inset 0 0 30px rgba(255,179,71,0.3);
    animation: spin-pulse 1s linear infinite;
  }
  .app[data-state="thinking"] .mic-btn svg { fill: var(--amber); filter: drop-shadow(0 0 6px rgba(255,179,71,0.6)); }

  .app[data-state="speaking"] .pulse-ring {
    border-color: #6cffb0;
    box-shadow: 0 0 34px rgba(108,255,176,0.55), inset 0 0 30px rgba(108,255,176,0.3);
    animation: breathe 0.6s ease-in-out infinite;
  }
  .app[data-state="speaking"] .mic-btn svg { fill: #6cffb0; filter: drop-shadow(0 0 6px rgba(108,255,176,0.6)); }

  .app[data-state="error"] .pulse-ring {
    border-color: var(--red);
    box-shadow: 0 0 30px rgba(255,77,94,0.55);
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.06); opacity: 0.85; }
  }
  @keyframes spin-pulse {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.04); }
    100% { transform: rotate(360deg) scale(1); }
  }

  /* --- Status label --- */
  .status-label {
    margin-top: 22px;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text-dim);
    z-index: 2;
    min-height: 18px;
  }
  .status-label.active { color: var(--cyan); text-shadow: 0 0 8px var(--cyan-glow); }

  /* --- Transcript panel --- */
  .transcript-panel {
    z-index: 2;
    width: min(600px, 92vw);
    background: rgba(11, 16, 23, 0.7);
    border: 1px solid rgba(76,224,255,0.15);
    border-radius: 14px;
    padding: 16px 20px;
    backdrop-filter: blur(6px);
    max-height: 30vh;
    overflow-y: auto;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
  }
  .transcript-panel::-webkit-scrollbar { width: 6px; }
  .transcript-panel::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 3px; }

  .line {
    margin: 6px 0;
    font-size: 14px;
    line-height: 1.5;
  }
  .line.user { color: var(--text-main); }
  .line.user::before { content: "You  ›  "; color: var(--text-dim); }
  .line.blue { color: var(--cyan); }
  .line.blue::before { content: "BLUE  ›  "; color: var(--cyan-dim); }
  .line.system { color: var(--red); font-style: italic; }
  .line.system::before { content: "SYSTEM  ›  "; color: var(--red); }

  .placeholder {
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
  }

  .footer-hint {
    margin-top: 14px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    z-index: 2;
    text-align: center;
    max-width: 90vw;
  }
</style>
</head>
<body>
<div class="app" id="app" data-state="idle">
  <div class="grid-overlay"></div>

  <div class="brand">
    <h1>B L U E</h1>
    <span>Behavioral Logic &amp; Utility Engine</span>
  </div>

  <div class="core-wrap">
    <div class="ring ring-outer"></div>
    <div class="ring ring-mid"></div>
    <div class="pulse-ring"></div>
    <button class="mic-btn" id="micBtn" aria-label="Talk to Blue">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
  </div>

  <div class="status-label" id="statusLabel">TAP THE CORE TO BEGIN</div>

  <div class="transcript-panel" id="transcriptPanel">
    <div class="placeholder" id="placeholder">Conversation log will appear here.</div>
  </div>

  <div class="footer-hint">
    Requires microphone access &middot; Best in Chrome or Edge &middot; Speech recognition runs locally in your browser
  </div>
</div>

<audio id="blueAudio" style="display:none;"></audio>

<script>
(function () {
  const appEl = document.getElementById('app');
  const micBtn = document.getElementById('micBtn');
  const statusLabel = document.getElementById('statusLabel');
  const transcriptPanel = document.getElementById('transcriptPanel');
  const placeholder = document.getElementById('placeholder');
  const audioEl = document.getElementById('blueAudio');

  // Persistent session id for server-side conversational memory
  const SESSION_KEY = 'blue_session_id';
  let sessionId = localStorage.getItem(SESSION_KEY);
  if (!sessionId) {
    sessionId = (crypto.randomUUID ? crypto.randomUUID() : `sess-${Date.now()}-${Math.random().toString(16).slice(2)}`);
    localStorage.setItem(SESSION_KEY, sessionId);
  }

  const STATES = { IDLE: 'idle', LISTENING: 'listening', THINKING: 'thinking', SPEAKING: 'speaking', ERROR: 'error' };
  const STATUS_TEXT = {
    idle: 'TAP THE CORE TO BEGIN',
    listening: 'LISTENING...',
    thinking: 'PROCESSING...',
    speaking: 'SPEAKING...',
    error: 'SYSTEM ERROR'
  };

  function setState(state, customLabel) {
    appEl.setAttribute('data-state', state);
    statusLabel.textContent = customLabel || STATUS_TEXT[state] || '';
    statusLabel.classList.toggle('active', state !== STATES.IDLE);
  }

  function addLine(role, text) {
    if (placeholder) placeholder.remove();
    const div = document.createElement('div');
    div.className = `line ${role}`;
    div.textContent = text;
    transcriptPanel.appendChild(div);
    transcriptPanel.scrollTop = transcriptPanel.scrollHeight;
  }

  // ---------------------------------------------------------------------
  // Web Speech API (STT) setup
  // ---------------------------------------------------------------------
  const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isListening = false;

  if (!SpeechRecognitionImpl) {
    setState(STATES.ERROR, 'SPEECH RECOGNITION UNSUPPORTED');
    addLine('system', 'This browser does not support the Web Speech API. Please use Chrome or Edge.');
  } else {
    recognition = new SpeechRecognitionImpl();
    recognition.lang = 'en-GB';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      isListening = true;
      setState(STATES.LISTENING);
    };

    recognition.onerror = (event) => {
      isListening = false;
      let msg = 'Speech recognition error.';
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        msg = 'Microphone access was denied. Please allow microphone permissions and try again.';
      } else if (event.error === 'no-speech') {
        msg = 'No speech detected. Tap the core to try again.';
      } else if (event.error === 'audio-capture') {
        msg = 'No microphone was found on this device.';
      }
      addLine('system', msg);
      setState(STATES.ERROR, 'MIC ERROR');
      setTimeout(() => setState(STATES.IDLE), 2200);
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript.trim();
      if (transcript) {
        addLine('user', transcript);
        sendToBlue(transcript);
      }
    };

    recognition.onend = () => {
      isListening = false;
      if (appEl.getAttribute('data-state') === STATES.LISTENING) {
        setState(STATES.IDLE);
      }
    };
  }

  micBtn.addEventListener('click', () => {
    if (!recognition) return;
    const current = appEl.getAttribute('data-state');
    if (current === STATES.THINKING || current === STATES.SPEAKING) return; // busy

    if (isListening) {
      recognition.stop();
      return;
    }
    try {
      recognition.start();
    } catch (err) {
      // start() throws if called while already active; ignore safely
      console.warn('Recognition start error:', err);
    }
  });

  // ---------------------------------------------------------------------
  // Backend communication + TTS playback
  // ---------------------------------------------------------------------
  async function sendToBlue(message) {
    setState(STATES.THINKING);
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, session_id: sessionId })
      });

      const data = await res.json();

      if (!res.ok) {
        const detail = data && data.detail ? data.detail : 'Unknown server error.';
        addLine('system', detail);
        setState(STATES.ERROR, 'SERVER ERROR');
        setTimeout(() => setState(STATES.IDLE), 2500);
        return;
      }

      addLine('blue', data.text);

      if (data.warning) {
        addLine('system', data.warning);
      }

      if (data.audio_url) {
        playAudio(data.audio_url);
      } else {
        setState(STATES.IDLE);
      }
    } catch (err) {
      console.error(err);
      addLine('system', 'Unable to reach the Blue backend. Is the server running?');
      setState(STATES.ERROR, 'CONNECTION LOST');
      setTimeout(() => setState(STATES.IDLE), 2500);
    }
  }

  function playAudio(url) {
    setState(STATES.SPEAKING);
    audioEl.src = url;
    audioEl.onended = () => setState(STATES.IDLE);
    audioEl.onerror = () => {
      addLine('system', 'Audio playback failed.');
      setState(STATES.IDLE);
    };
    audioEl.play().catch((err) => {
      console.warn('Autoplay blocked or failed:', err);
      addLine('system', 'Tap anywhere on the page to enable audio playback, then try again.');
      setState(STATES.IDLE);
    });
  }

  // Some browsers block autoplay until first user gesture; this primes it.
  document.body.addEventListener('click', () => {
    audioEl.play().catch(() => {});
    audioEl.pause();
  }, { once: true });
})();
</script>
</body>
</html>
